        observables_continue_on_error: false
        lfs: false
    - uses: ./.github/actions/build
      with:
        os: ubuntu-latest
        os_name: linux
        arch: x86_64
          # rust_target: x86_64-unknown-linux-gnu
          # docker_platform: linux/amd64
          # container: quay.io/pypa/manylinux2014_x86_64 # for glibc 2.17
